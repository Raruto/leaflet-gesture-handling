<!DOCTYPE html>
<html>

<head>
  <title>leaflet-gesture-handling.js</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    const params = new URLSearchParams(location.search);
    const leaflet2 = params.get('leaflet') === '2';
    document.write(`<link rel="stylesheet" href="https://unpkg.com/leaflet@${leaflet2 ? '2.0.0-alpha.1' : '1.9.4'}/dist/leaflet.css">`);
    document.write(`<script src="https://unpkg.com/leaflet@${leaflet2 ? '2.0.0-alpha.1' : '1.9.4'}/dist/${leaflet2 ? 'leaflet-global.js' : 'leaflet.js'}"><\/script>`);
  </script>
  <script>if (leaflet2) window.L = window.leaflet;</script>
  <script>
    document.write(`<script src="../dist/leaflet-gesture-handling${params.has('min') ? '.min' : ''}.js"><\/script>`);
  </script>
  <link rel="stylesheet" href="../dist/leaflet-gesture-handling.css">

  <style>
    html,
    body,
    .map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="map" class="map"></div>

  <script>
    const map = new L.Map('map', {
      center: [41.4583, 12.7059],
      zoom: 5,
      tap: false,
      dragging: true,
      scrollWheelZoom: true,
      gestureHandling: true,
      gestureHandlingOptions: { // OPTIONAL
        // text: {
        //   touch: "Hey bro, use two fingers to move the map",
        //   scroll: "Hey bro, use ctrl + scroll to zoom the map",
        //   scrollMac: "Hey bro, use \u2318 + scroll to zoom the map"
        // },
        // locale: 'en', // set language of the warning message.
        // duration: 6000 // set time in ms before the message should disappear.
        duration: 250,
        locale: params.get('locale')
      }
    });

    const Basemap = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'Map data: &copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>', //, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)',
    });
    Basemap.addTo(map);

    const popup = new L.Popup({ maxHeight: 150 })
      .setLatLng(map.getCenter())
      .setContent('<p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p><p>Hello world!<br />This is a nice popup.</p>')
      .openOn(map);
  </script>
</body>

</html>
